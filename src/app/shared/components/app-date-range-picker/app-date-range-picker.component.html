<div class="date-range" [class.date-range--invalid]="error() && touched">
  @if (label()) {
    <span class="field-label">{{ label() | translate }}</span>
  }

  <div class="range-controls">
    <label>
      <span>{{ startLabel() | translate }}</span>
      <input
        type="date"
        [value]="start"
        [disabled]="isDisabled || disabled()"
        (input)="setStart($event)"
        (blur)="onBlur()"
      />
    </label>
    <label>
      <span>{{ endLabel() | translate }}</span>
      <input
        type="date"
        [value]="end"
        [disabled]="isDisabled || disabled()"
        (input)="setEnd($event)"
        (blur)="onBlur()"
      />
    </label>
  </div>

  @if (error() && touched) {
    <span class="field-message field-message--error">{{ error() | translate }}</span>
  } @else if (hint()) {
    <span class="field-message">{{ hint() | translate }}</span>
  }
</div>
