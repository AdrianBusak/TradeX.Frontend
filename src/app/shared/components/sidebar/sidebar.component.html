<aside class="sidebar">
  <div class="sidebar-header">
    <button
      class="icon-btn hide-mobile"
      type="button"
      (click)="sidebar.toggleCollapse()"
      [attr.aria-label]="(sidebar.collapsed() ? 'NAV.EXPAND' : 'NAV.COLLAPSE') | translate"
    >
      <mat-icon aria-hidden="true">{{ sidebar.collapsed() ? 'menu' : 'menu_open' }}</mat-icon>
    </button>

    <a class="brand" [routerLink]="['/dashboard']" [attr.aria-label]="'NAV.ARIA_HOME' | translate">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="4" width="24" height="24" rx="7" fill="var(--tx-brand)" />
        <path d="M10 19.5h4.3l2.7-7 2.2 4.8H22" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>TradeX</span>
    </a>

    <button
      class="icon-btn show-mobile"
      type="button"
      (click)="sidebar.closeMobile()"
      [attr.aria-label]="'NAV.COLLAPSE' | translate"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <nav [attr.aria-label]="'NAV.ARIA_MAIN' | translate">
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        [title]="sidebar.collapsed() ? (item.labelKey | translate) : ''"
        (click)="sidebar.closeMobile()"
      >
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.labelKey | translate }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="workspace-pill">
      <span class="workspace-dot"></span>
      <span>{{ 'NAV.WORKSPACE' | translate }}</span>
    </div>
  </div>
</aside>
