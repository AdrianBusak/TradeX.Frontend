@if (open()) {
  <div class="modal-backdrop" (click)="closed.emit()"></div>
  <section class="modal" role="dialog" aria-modal="true" [attr.aria-label]="title()">
    <header>
      <div>
        <h2>{{ title() }}</h2>
        @if (description()) {
          <p>{{ description() }}</p>
        }
      </div>
      <button type="button" class="close-btn" (click)="closed.emit()" aria-label="Close">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </header>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <footer>
      <app-button variant="secondary" (pressed)="closed.emit()">{{ cancelLabel() }}</app-button>
      <app-button [variant]="confirmVariant()" [disabled]="confirmDisabled()" (pressed)="confirmed.emit()">
        {{ confirmLabel() }}
      </app-button>
    </footer>
  </section>
}
