@if (accessState$ | async; as state) {
  @if (state.isLoading) {
    <div class="loading-screen" aria-live="polite">
      <div class="loading-inner">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">{{ 'AUTH.LOADING' | translate }}</p>
      </div>
    </div>
  } @else if (state.canEnter) {
    <router-outlet />
  } @else {
    <div class="login-screen">
      <div class="login-card">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" aria-hidden="true">
            <path d="M12 2L22 12L12 22L2 12Z" fill="var(--color-accent)" />
            <path d="M12 6L18 12L12 18L6 12Z" fill="var(--color-bg-surface)" />
            <path d="M12 9L15 12L12 15L9 12Z" fill="var(--color-accent)" />
          </svg>
          <span class="login-brand">TradeX</span>
        </div>
        <p class="login-subtitle">{{ 'AUTH.LOGIN_SUBTITLE' | translate }}</p>
        <button class="login-btn" type="button" (click)="login()">
          {{ 'AUTH.LOGIN_BTN' | translate }}
        </button>
      </div>
    </div>
  }
}
<app-toast-host />
